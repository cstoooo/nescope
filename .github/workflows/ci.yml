name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installed from the official script rather than a marketplace action so
      # that the workflow depends only on the toolchain's own release channel.
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain versions
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Type check with warnings denied
        run: moon check --target all --deny-warn

      - name: Run tests on all supported backends
        run: moon test --target all --deny-warn

      - name: Build the CLI
        run: moon build cmd/main --deny-warn

      - name: Public interface check
        run: |
          moon info
          git diff --exit-code

      - name: CLI integration tests
        run: bash scripts/cli-smoke.sh
