name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installed from the official script rather than a marketplace action so
      # that the workflow depends only on the toolchain's own release channel.
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain versions
        run: |
          moon version --all

      - name: Update dependencies
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Type check with warnings denied
        run: moon check --deny-warn

      - name: Run tests
        run: moon test

      - name: Build the CLI
        run: moon build cmd/main

      - name: Smoke-test the CLI on a real ROM
        run: |
          moon run cmd/main -- --trace internal/fixtures/nestest.nes --limit 5